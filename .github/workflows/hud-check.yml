name: Windows HUD check

# Runs an already-built Windows app on GitHub's Windows machine, shows the HUD, and saves screenshots,
# pywebview's own log and Aether's log - to see exactly what testers see on screen.
# Maintained in the private repository (packaging/templates/hud-check-workflow.yml).

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run whose Windows app to check"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  hud:
    if: github.repository_owner == 'vansh7266'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Get the built app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.run_id }} -R ${{ github.repository }} -n aether-windows-x64 -D app
          Expand-Archive (Get-ChildItem app\*.zip)[0].FullName -DestinationPath app

      - name: Start Aether with the HUD shown, and look at the screen
        shell: pwsh
        env:
          PYWEBVIEW_LOG: debug
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $bmp.Save("$PWD\out\$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          New-Item -ItemType Directory out | Out-Null
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue |
            Select-Object pv | Out-File out\webview2-version.txt
          Shot "0-before"
          $p = Start-Process app\aether\aether-bin.exe -PassThru -RedirectStandardOutput out\stdout.txt -RedirectStandardError out\stderr.txt
          Start-Sleep 25
          Shot "1-after-start"
          Start-Sleep 10
          Shot "2-later"
          Get-Process aether-bin -ErrorAction SilentlyContinue | Select-Object Id, MainWindowTitle, Responding | Out-File out\processes.txt
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Copy-Item "$env:USERPROFILE\.aether\logs" out\aether-logs -Recurse -ErrorAction SilentlyContinue
          Get-Content out\stderr.txt -Tail 60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hud-check
          path: out
